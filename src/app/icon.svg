<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>DSA &amp; System Design</title>
  <defs>
    <linearGradient id="bg" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5ffa"/>
      <stop offset="1" stop-color="#3a2eb8"/>
    </linearGradient>
  </defs>
  <style>
    .base { stroke: #fff; stroke-opacity: .34; }
    .comet { stroke: #ffe3a1; stroke-dasharray: 16 200; stroke-dashoffset: 16; animation: comet 4s linear infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: pop 4s ease-out infinite; }
    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 4s ease-out infinite; }
    .n1, .r1 { animation-delay: 0s; } .n2, .r2 { animation-delay: 1.4s; } .n3, .r3 { animation-delay: 2.8s; }
    @keyframes comet { 0% { stroke-dashoffset: 16; } 70% { stroke-dashoffset: -84; } 85%, 100% { stroke-dashoffset: -100; } }
    @keyframes pop { 0% { transform: scale(1); } 5% { transform: scale(1.3); } 18%, 100% { transform: scale(1); } }
    @keyframes ring { 0% { opacity: .9; transform: scale(1); } 16%, 100% { opacity: 0; transform: scale(2.1); } }
    @media (prefers-reduced-motion: reduce) { .comet, .ring { display: none; } .node { animation: none; } .base { stroke-opacity: .9; } }
  </style>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>
  <path pathLength="100" class="base" d="M45 18 C37 12 19 14 19 24 C19 31 26 32 32 32 C38 32 45 33 45 40 C45 50 27 52 19 46" fill="none" stroke-width="4.4" stroke-linecap="round"/>
  <path pathLength="100" class="comet" d="M45 18 C37 12 19 14 19 24 C19 31 26 32 32 32 C38 32 45 33 45 40 C45 50 27 52 19 46" fill="none" stroke-width="4.4" stroke-linecap="round"/>
  <circle class="ring r1" cx="45" cy="18" r="6" fill="none" stroke="#f0b35a" stroke-width="1.6"/>
  <circle class="ring r2" cx="32" cy="32" r="5.2" fill="none" stroke="#fff" stroke-width="1.6"/>
  <circle class="ring r3" cx="19" cy="46" r="6" fill="none" stroke="#5eead4" stroke-width="1.6"/>
  <circle class="node n1" cx="45" cy="18" r="6" fill="#f0b35a"/>
  <circle class="node n2" cx="32" cy="32" r="5.2" fill="#fff"/>
  <circle class="node n3" cx="19" cy="46" r="6" fill="#5eead4"/>
  <circle cx="45" cy="18" r="2" fill="#3a2eb8"/>
  <circle cx="32" cy="32" r="1.8" fill="#3a2eb8"/>
  <circle cx="19" cy="46" r="2" fill="#3a2eb8"/>
</svg>
